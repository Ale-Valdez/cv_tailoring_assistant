name: cv-tailor

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cv_tailor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cv_tailor}
      POSTGRES_DB: ${POSTGRES_DB:-cv_tailor}
    # Postgres 18 guarda los datos en un subdirectorio de este path.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      PORT: "3001"
      FILES_DIR: /data/files
      DATABASE_URL: postgresql://${POSTGRES_USER:-cv_tailor}:${POSTGRES_PASSWORD:-cv_tailor}@db:5432/${POSTGRES_DB:-cv_tailor}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  renderer:
    build:
      context: .
      dockerfile: apps/renderer/Dockerfile
    environment:
      PORT: "3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
    name: cv-tailor-pgdata
  files:
